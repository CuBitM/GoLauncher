name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install GCC via MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-pkg-config

      - name: Build EXE
        env:
          CGO_ENABLED: "1"
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          go mod tidy
          go build -ldflags="-s -w -H windowsgui" -o GoLauncher.exe ./cmd/
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoLauncher-Windows
          path: GoLauncher.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GoLauncher.exe
          name: "GoLauncher ${{ github.ref_name }}"
          body: |
            ## GoLauncher ${{ github.ref_name }}
            Download **GoLauncher.exe** and run — no installation needed!
            - Auto-download Java (8/17/21)
            - Offline mode
            - Fullscreen support
            - RAM slider
            - Fabric mod loader
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
