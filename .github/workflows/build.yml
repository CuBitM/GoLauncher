name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install GCC (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-pkg-config

      - name: Build
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
          GOPATH: "C:/hostedtoolcache/windows/go/1.21/x64"
          PATH: "C:/hostedtoolcache/windows/go/1.21/x64/bin:/mingw64/bin:$PATH"
        run: |
          cd "$GITHUB_WORKSPACE"
          go mod tidy
          go build -ldflags="-s -w -H windowsgui" -o GoLauncher.exe ./cmd/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoLauncher-Windows
          path: GoLauncher.exe

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GoLauncher.exe
          name: "GoLauncher ${{ github.ref_name }}"
          body: |
            ## GoLauncher ${{ github.ref_name }}

            ### Stažení / Download
            Stáhni **GoLauncher.exe** a spusť — žádná instalace není potřeba!
            Download **GoLauncher.exe** and run — no installation needed!

            ### Co je nového / What's new
            - Auto-download Javy (Java 8/17/21 podle verze MC)
            - Offline mód — hraj bez Microsoft účtu
            - Fullscreen podpora
            - RAM slider
            - Fabric mod loader podpora
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
